<!doctype html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema de Votação{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Questrial&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "DM Sans", sans-serif; }
        h1, h2, h3 { font-family: "Questrial", sans-serif; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    {% block site_header %}
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex w-full max-w-6xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
            <a class="font-semibold tracking-tight" href="{% url 'eleicao:inicio' %}">e-Votos — Sistema Eleitoral</a>
            <a class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:border-indigo-600 hover:text-indigo-700"
               href="{% url 'eleicao:painel' %}">Acesso administrativo</a>
        </div>
    </header>
    {% endblock %}
    <main class="{% block main_class %}mx-auto max-w-3xl px-6 py-12{% endblock %}">
        {% for message in messages %}
            <div class="mb-5 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
